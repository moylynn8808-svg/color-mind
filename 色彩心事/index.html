<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>色彩心事</title>
  <meta name="description" content="不是测知识，是照见情绪">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ========== 首页 ========== -->
<div id="page-home" class="page active">
  <div class="home-bg">
    <div class="watercolor-blob"></div>
    <div class="watercolor-blob"></div>
    <div class="watercolor-blob"></div>
    <div class="watercolor-blob"></div>
    <div class="watercolor-blob"></div>
  </div>
  <div class="home-content">
    <div class="home-emoji">🎨</div>
    <h1 class="home-title">色彩心事</h1>
    <p class="home-subtitle">不是测知识，是照见情绪</p>
    <button class="start-btn" id="start-btn">点击开始测试</button>
    <button class="history-link" id="history-btn">📜 查看历史记录</button>
  </div>
</div>

<!-- ========== 测试页 ========== -->
<div id="page-test" class="page">
  <div class="progress-bar" id="progress">1 / 5</div>
  <div id="question-container">
    <div id="question-text"></div>
    <div id="options"></div>
  </div>
</div>

<!-- ========== 结果页 ========== -->
<div id="page-result" class="page">
  <div id="result-bg">
    <div class="result-main">
      <span id="main-emoji"></span>
      <span id="main-label"></span>
      <span id="main-name"></span>
    </div>

    <div class="sub-personality">
      <div class="sub-label">—— 你的另一面 ——</div>
      <div class="sub-content">
        <span class="sub-emoji" id="sub-emoji"></span>
        <span class="sub-name" id="sub-name"></span>
      </div>
      <div class="sub-hint" id="sub-hint"></div>
    </div>

    <div class="anxiety-box">
      <h3>你可能在经历</h3>
      <p id="anxiety-text"></p>
    </div>

    <div class="copy-box">
      <h3>适合你的朋友圈文案</h3>
      <p id="copy-text"></p>
      <button class="copy-btn" id="copy-btn">复制文案</button>
    </div>

    <div class="video-box">
      <h3>推荐观看</h3>
      <p id="video-title"></p>
      <p id="video-desc"></p>
    </div>

    <div class="golden-box">
      <p id="golden-text"></p>
    </div>
  </div>

  <div class="action-buttons">
    <button class="action-btn" id="poster-btn">📷 生成海报</button>
    <button class="action-btn" id="share-btn">🔗 分享</button>
  </div>

  <button class="back-btn" onclick="location.reload()">🏠 返回首页</button>

  <!-- 隐藏海报容器 -->
  <div class="poster-container">
    <div id="poster-content">
      <div id="poster-bg" class="poster-bg"></div>
      <div class="poster-emoji" id="poster-emoji"></div>
      <div class="poster-label" id="poster-label"></div>
      <div class="poster-name" id="poster-name"></div>
      <div class="poster-golden" id="poster-golden"></div>
      <div class="poster-logo">色彩心事 · 鱼溪手绘</div>
    </div>
  </div>
</div>

<!-- ========== 历史记录页 ========== -->
<div id="page-history" class="page">
  <h2 class="history-title">历史记录</h2>
  <div id="history-list"></div>
  <button class="back-btn" id="back-btn">返回首页</button>
</div>

<!-- 依赖 -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>

</body>
</html>
